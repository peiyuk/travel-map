<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pei's Travel Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:sans-serif;background:#0f0f1a;color:#e8e8f0;min-height:100vh}
.header{padding:2rem 2rem 1rem;display:flex;align-items:baseline;gap:1rem;flex-wrap:wrap}
h1{font-size:22px;font-weight:500}
.subtitle{font-size:14px;color:#888}
.stats{display:flex;gap:1rem;padding:0 2rem 1.5rem;flex-wrap:wrap}
.stat{background:#1a1a2e;border:0.5px solid #333;border-radius:10px;padding:.75rem 1.25rem}
.stat-num{font-size:22px;font-weight:500;color:#7fb3f5}
.stat-label{font-size:12px;color:#888;margin-top:2px}
.tabs{display:flex;padding:0 2rem 1.5rem;flex-wrap:wrap;gap:0}
.tab{padding:6px 18px;font-size:13px;border:0.5px solid #333;background:transparent;color:#888;cursor:pointer;transition:all .2s;white-space:nowrap}
.tab:first-child{border-radius:8px 0 0 8px}
.tab:last-child{border-radius:0 8px 8px 0}
.tab.active{background:#1e3a5f;color:#7fb3f5;border-color:#2a5a8f}
/* map */
#map-view{padding:0 2rem 2rem}
#map-container{width:100%;height:500px;border-radius:12px;overflow:hidden;border:0.5px solid #2a2a44}
#leaflet-map{width:100%;height:100%}
.map-tooltip{background:#1a1a2e;border:0.5px solid #3a5a8f;border-radius:8px;color:#e8e8f0;font-size:13px;padding:8px 12px;box-shadow:none}
.map-tooltip b{color:#7fb3f5;display:block;margin-bottom:3px}
.leaflet-control-zoom a{background:#1a1a2e !important;color:#7fb3f5 !important;border-color:#2a2a44 !important;line-height:26px !important}
.leaflet-control-zoom a:hover{background:#2a5a8f !important}
.leaflet-container{font-family:sans-serif !important;font-size:13px !important}
.leaflet-tooltip{padding:0 !important;border:none !important;background:transparent !important;box-shadow:none !important}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#1a1a2e;color:#e8e8f0}
/* list */
#list-view{display:none;padding:0 2rem 2rem}
.region-filter{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:1rem}
.rf{font-size:12px;padding:4px 12px;border:0.5px solid #333;border-radius:20px;background:transparent;color:#888;cursor:pointer}
.rf.active{background:#1e3a5f;color:#7fb3f5;border-color:#2a5a8f}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.card{background:#1a1a2e;border:0.5px solid #333;border-radius:10px;padding:1rem;cursor:pointer;transition:border-color .2s}
.card:hover{border-color:#4a8abf}
.card-flag{font-size:28px;margin-bottom:8px}
.card-name{font-size:15px;font-weight:500;margin-bottom:4px}
.card-meta{font-size:12px;color:#888;line-height:1.7}
.pill{display:inline-block;background:#1e3a5f;color:#7fb3f5;font-size:11px;padding:2px 8px;border-radius:20px;margin-top:6px}
/* modal */
.modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.75);z-index:300;align-items:center;justify-content:center}
.modal.open{display:flex}
.modal-box{background:#1a1a2e;border:0.5px solid #3a5a8f;border-radius:14px;padding:1.5rem;max-width:460px;width:92%;max-height:82vh;overflow-y:auto}
.modal-header{display:flex;align-items:center;gap:12px;margin-bottom:1.25rem}
.modal-flag{font-size:36px}
.modal-title{font-size:20px;font-weight:500}
.modal-sub{font-size:13px;color:#888}
.modal-close{margin-left:auto;background:transparent;border:none;color:#888;font-size:20px;cursor:pointer;line-height:1}
.modal-close:hover{color:#fff}
/* visit cards inside modal */
.visit-card{background:#0f0f1a;border:0.5px solid #2a2a3a;border-radius:10px;padding:12px 14px;margin-bottom:10px}
.visit-dates{font-size:13px;font-weight:500;color:#7fb3f5;margin-bottom:6px}
.visit-cities{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.city-tag{background:#1e3a5f;color:#c8d8f8;font-size:12px;padding:3px 10px;border-radius:20px}
.visit-meta{font-size:12px;color:#888;line-height:1.7}
.visit-note{font-size:12px;color:#aaa;font-style:italic;margin-top:4px}
.new-badge{display:inline-block;background:#0f3a20;color:#5abf80;font-size:10px;padding:1px 6px;border-radius:10px;margin-left:6px;vertical-align:middle}
/* add / edit */
#add-view,#edit-view{display:none;padding:0 2rem 2rem}
.form-card{background:#1a1a2e;border:0.5px solid #333;border-radius:12px;padding:1.5rem;max-width:540px}
.form-section{font-size:13px;font-weight:500;color:#7fb3f5;margin:1rem 0 .5rem;padding-top:.75rem;border-top:0.5px solid #2a2a3a}
.form-section:first-child{margin-top:0;padding-top:0;border-top:none}
.form-row{margin-bottom:.9rem}
.form-row label{display:block;font-size:12px;color:#888;margin-bottom:5px}
.form-row input,.form-row select,.form-row textarea{width:100%;background:#0f0f1a;border:0.5px solid #333;border-radius:8px;padding:8px 12px;color:#e8e8f0;font-size:14px;font-family:sans-serif;outline:none;transition:border-color .2s}
.form-row input:focus,.form-row select:focus,.form-row textarea:focus{border-color:#4a8abf}
.form-row select option{background:#1a1a2e}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
/* cities input area */
.cities-list{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;min-height:28px}
.city-chip{display:flex;align-items:center;gap:5px;background:#1e3a5f;color:#c8d8f8;font-size:13px;padding:4px 10px;border-radius:20px}
.city-chip button{background:transparent;border:none;color:#7fb3f5;cursor:pointer;font-size:14px;line-height:1;padding:0}
.city-input-row{display:flex;gap:8px}
.city-input-row input{flex:1}
.city-add-btn{padding:8px 14px;border-radius:8px;border:0.5px solid #2a5a8f;background:#1e3a5f;color:#7fb3f5;font-size:13px;cursor:pointer;white-space:nowrap}
.city-add-btn:hover{background:#2a5a8f}
.btn{padding:8px 20px;border-radius:8px;font-size:14px;cursor:pointer;border:0.5px solid #333;transition:all .2s}
.btn-primary{background:#1e3a5f;color:#7fb3f5;border-color:#2a5a8f}
.btn-primary:hover{background:#2a5a8f}
.btn-ghost{background:transparent;color:#888}
.btn-ghost:hover{color:#e8e8f0}
.btn-danger{background:transparent;color:#e06060;border-color:#6a3030;font-size:12px;padding:4px 10px}
.btn-danger:hover{background:#3a1a1a}
.form-actions{display:flex;gap:10px;margin-top:1.25rem;align-items:center}
.msg{font-size:13px;padding:8px 12px;border-radius:8px;margin-top:10px;display:none}
.msg.success{background:#0f3a20;color:#5abf80;border:0.5px solid #2a6a40;display:block}
.msg.error{background:#3a0f0f;color:#e06060;border:0.5px solid #6a2a2a;display:block}
/* edit list */
.edit-row{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:#1a1a2e;border:0.5px solid #2a2a3a;border-radius:10px;margin-bottom:8px;gap:12px}
.edit-row-info{min-width:0}
.edit-row-name{font-size:14px;font-weight:500;color:#c8d8f8}
.edit-row-meta{font-size:12px;color:#888;margin-top:3px}
.edit-modal-wrap{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.75);z-index:200;align-items:center;justify-content:center}
.edit-modal-wrap.open{display:flex}
.edit-modal-box{background:#1a1a2e;border:0.5px solid #3a5a8f;border-radius:14px;padding:1.5rem;max-width:500px;width:92%;max-height:85vh;overflow-y:auto}
</style>
</head>
<body>

<script>const APPS_SCRIPT_URL = 'YOUR_APPS_SCRIPT_URL_HERE';</script>

<div class="header">
  <h1>🌍 Pei's Travel Map</h1>
  <span class="subtitle">2007 – present</span>
</div>

<div class="stats">
  <div class="stat"><div class="stat-num" id="s-countries">—</div><div class="stat-label">Countries</div></div>
  <div class="stat"><div class="stat-num" id="s-cities">—</div><div class="stat-label">Cities</div></div>
  <div class="stat"><div class="stat-num" id="s-trips">—</div><div class="stat-label">Trips</div></div>
  <div class="stat"><div class="stat-num" id="s-fav">—</div><div class="stat-label">Most visited</div></div>
</div>

<div class="tabs">
  <button class="tab active" onclick="switchTab('map')">🗺 Map</button>
  <button class="tab" onclick="switchTab('list')">📋 Countries</button>
  <button class="tab" onclick="switchTab('add')">＋ Add Trip</button>
  <button class="tab" onclick="switchTab('edit')">✎ Edit Records</button>
</div>
<div id="year-bar" style="display:flex;gap:8px;flex-wrap:wrap;padding:0 2rem 1.25rem;align-items:center">
  <span style="font-size:12px;color:#666;margin-right:4px">Year</span>
  <button class="yf active" onclick="setYear('all',this)">All</button>
</div>

<!-- MAP -->
<div id="map-view">
  <div id="map-container"><div id="leaflet-map"></div></div>
</div>

<!-- LIST -->
<div id="list-view">
  <div class="region-filter">
    <button class="rf active" onclick="filterRegion('',this)">All</button>
    <button class="rf" onclick="filterRegion('Asia',this)">Asia</button>
    <button class="rf" onclick="filterRegion('Europe',this)">Europe</button>
    <button class="rf" onclick="filterRegion('Americas',this)">Americas</button>
    <button class="rf" onclick="filterRegion('Oceania',this)">Oceania</button>
  </div>
  <div class="grid" id="card-grid"></div>
</div>

<!-- ADD -->
<div id="add-view">
  <div class="form-card">
    <div class="form-section">Trip details</div>
    <div class="f2">
      <div class="form-row"><label>Country</label><input id="f-country" placeholder="e.g. Japan"/></div>
      <div class="form-row"><label>Region</label>
        <select id="f-region">
          <option value="Asia">Asia</option><option value="Europe">Europe</option>
          <option value="Americas">Americas</option><option value="Oceania">Oceania</option>
          <option value="Africa">Africa</option><option value="Middle East">Middle East</option>
        </select>
      </div>
    </div>
    <div class="f2">
      <div class="form-row"><label>Departure</label><input type="date" id="f-from"/></div>
      <div class="form-row"><label>Return</label><input type="date" id="f-to"/></div>
    </div>

    <div class="form-section">Cities visited</div>
    <div class="form-row">
      <label>Add each city and press Enter or click +</label>
      <div class="cities-list" id="f-cities-list"></div>
      <div class="city-input-row">
        <input id="f-city-input" placeholder="e.g. Tokyo" onkeydown="if(event.key==='Enter'){event.preventDefault();addCityChip('f')}"/>
        <button class="city-add-btn" onclick="addCityChip('f')">+ Add</button>
      </div>
    </div>

    <div class="form-section">Extra info <span style="color:#555;font-weight:400">(optional)</span></div>
    <div class="form-row"><label>Travel companions</label><input id="f-companion" placeholder="e.g. Family, Friends, Solo"/></div>
    <div class="form-row"><label>Notes</label><textarea id="f-note" rows="2" placeholder="Brief thoughts..."></textarea></div>

    <div class="form-actions">
      <button class="btn btn-primary" id="save-btn" onclick="addTrip()">Save trip</button>
      <button class="btn btn-ghost" onclick="clearForm()">Clear</button>
    </div>
    <div class="msg" id="form-msg"></div>
  </div>
  <div id="added-trips" style="max-width:540px;margin-top:1.5rem"></div>
</div>

<!-- EDIT -->
<div id="edit-view">
  <div style="max-width:720px">
    <div style="display:flex;gap:10px;margin-bottom:1rem;flex-wrap:wrap;align-items:center">
      <input id="edit-search" placeholder="Search country or city…" oninput="renderEditList()"
        style="background:#0f0f1a;border:0.5px solid #333;border-radius:8px;padding:7px 12px;color:#e8e8f0;font-size:14px;outline:none;width:220px"/>
      <select id="edit-region-filter" onchange="renderEditList()"
        style="background:#0f0f1a;border:0.5px solid #333;border-radius:8px;padding:7px 12px;color:#e8e8f0;font-size:14px;outline:none">
        <option value="">All regions</option>
        <option value="Asia">Asia</option><option value="Europe">Europe</option>
        <option value="Americas">Americas</option><option value="Oceania">Oceania</option>
      </select>
      <span id="edit-count" style="font-size:13px;color:#888;margin-left:auto"></span>
    </div>
    <div id="edit-list"></div>
  </div>

  <!-- edit modal -->
  <div class="edit-modal-wrap" id="edit-modal">
    <div class="edit-modal-box">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem">
        <span style="font-size:16px;font-weight:500;color:#c8d8f8">Edit trip</span>
        <button onclick="closeEditModal()" style="background:transparent;border:none;color:#888;font-size:20px;cursor:pointer">✕</button>
      </div>
      <div class="f2">
        <div class="form-row"><label>Country</label><input id="e-country"/></div>
        <div class="form-row"><label>Region</label>
          <select id="e-region">
            <option value="Asia">Asia</option><option value="Europe">Europe</option>
            <option value="Americas">Americas</option><option value="Oceania">Oceania</option>
            <option value="Africa">Africa</option><option value="Middle East">Middle East</option>
          </select>
        </div>
      </div>
      <div class="f2">
        <div class="form-row"><label>Departure</label><input type="date" id="e-from"/></div>
        <div class="form-row"><label>Return</label><input type="date" id="e-to"/></div>
      </div>
      <div class="form-row">
        <label>Cities visited</label>
        <div class="cities-list" id="e-cities-list"></div>
        <div class="city-input-row">
          <input id="e-city-input" placeholder="Add city…" onkeydown="if(event.key==='Enter'){event.preventDefault();addCityChip('e')}"/>
          <button class="city-add-btn" onclick="addCityChip('e')">+ Add</button>
        </div>
      </div>
      <div class="form-row"><label>Companions</label><input id="e-companion"/></div>
      <div class="form-row"><label>Notes</label><textarea id="e-note" rows="2"></textarea></div>
      <div style="display:flex;gap:10px;margin-top:1.25rem;align-items:center">
        <button class="btn btn-primary" onclick="saveEdit()">Save changes</button>
        <button class="btn btn-ghost" onclick="closeEditModal()">Cancel</button>
        <button class="btn btn-danger" style="margin-left:auto" onclick="deleteEdit()">Delete</button>
      </div>
      <div class="msg" id="edit-msg"></div>
    </div>
  </div>
</div>

<!-- COUNTRY MODAL -->
<div class="modal" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal-box">
    <div class="modal-header">
      <span class="modal-flag" id="m-flag"></span>
      <div><div class="modal-title" id="m-name"></div><div class="modal-sub" id="m-sub"></div></div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div id="m-trips"></div>
  </div>
</div>

let addedTrips = [];

// ── Storage ───────────────────────────────────────────────────
const STORAGE_KEY = 'pei_travel_trips_v2';
async function fetchAdded() {
  if (!APPS_SCRIPT_URL||APPS_SCRIPT_URL==='YOUR_APPS_SCRIPT_URL_HERE') return;
  try {
    const r = await fetch(APPS_SCRIPT_URL);
    const json = await r.json();
    addedTrips = (json.data||[]).map(d=>({
      ...d,
      cities: typeof d.cities==='string' ? JSON.parse(d.cities||'[]') : (d.cities||[]),
      isNew: !d.__overrideIdx && !d.__deleted,
    }));
  } catch(e){ console.error(e); }
}
async function saveAdded() {
  if (!APPS_SCRIPT_URL||APPS_SCRIPT_URL==='YOUR_APPS_SCRIPT_URL_HERE') return;
  try {
    await fetch(APPS_SCRIPT_URL,{method:'POST',body:JSON.stringify({action:'set_all',data:addedTrips})});
  } catch(e){ console.error(e); }
}

// ── Core ──────────────────────────────────────────────────────
function rebuild() {
  BASE_TRIPS.forEach(t=>{ t.__hidden=false; });
  addedTrips.forEach(a=>{
    if (a.__deleted && a.targetIdx != null) {
      if (BASE_TRIPS[a.targetIdx]) BASE_TRIPS[a.targetIdx].__hidden=true;
    }
    if (a.__overrideIdx != null) {
      if (BASE_TRIPS[a.__overrideIdx]) BASE_TRIPS[a.__overrideIdx].__hidden=true;
    }
  });
  const visibleAdded = addedTrips.filter(t=>!t.__deleted);
  allTrips = [...BASE_TRIPS.filter(t=>!t.__hidden), ...visibleAdded]
    .sort((a,b)=>a.from.localeCompare(b.from));
  byCountry = {};
  allTrips.forEach(t=>{
    if (!byCountry[t.country]) byCountry[t.country]={trips:[],region:t.region};
    byCountry[t.country].trips.push(t);
  });
  buildYearBar();
  updateStats();
  redrawMap();
}

function fmtDate(s){
  const d=new Date(s);
  return d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
}
function getDays(from,to){ return Math.max(1,Math.round((new Date(to)-new Date(from))/86400000)); }

function updateStats(){
  const ft = filteredTrips();
  const cs = [...new Set(ft.map(t=>t.country))];
  const tripCounts = {};
  ft.forEach(t=>{ tripCounts[t.country]=(tripCounts[t.country]||0)+1; });
  const fav = cs.length ? cs.reduce((a,b)=>(tripCounts[a]||0)>=(tripCounts[b]||0)?a:b) : '—';
  document.getElementById('s-countries').textContent = cs.length||'—';
  document.getElementById('s-cities').textContent = new Set(ft.flatMap(t=>t.cities||[])).size||'—';
  document.getElementById('s-trips').textContent = ft.length||'—';
  document.getElementById('s-fav').textContent = fav==='—'?'—':(FLAGS[fav]||'')+' '+fav;
  document.querySelector('.stat-label:last-of-type');
  // update stat label to reflect year
  document.querySelectorAll('.stat-label')[3].textContent = activeYear==='all'?'Most visited':'Most visited';
}

// ── Tabs ──────────────────────────────────────────────────────
function switchTab(tab){
  ['map','list','add','edit'].forEach((t,i)=>{
    document.querySelectorAll('.tab')[i].classList.toggle('active',t===tab);
    document.getElementById(t+'-view').style.display=t===tab?'block':'none';
  });
  if(tab==='list') renderCards('');
  if(tab==='add') renderAddedList();
  if(tab==='edit') renderEditList();
  if(tab==='map') setTimeout(()=>{initMap();if(leafletMap)leafletMap.invalidateSize();},50);
}

// ── List / Cards ──────────────────────────────────────────────
function filterRegion(r,el){
  document.querySelectorAll('.rf').forEach(e=>e.classList.remove('active'));
  el.classList.add('active'); renderCards(r);
}
function renderCards(region){
  const ft = filteredTrips();
  const grid=document.getElementById('card-grid');
  grid.innerHTML='';
  const countries = [...new Set(ft.map(t=>t.country))].filter(c=>!region||byCountry[c]?.region===region);
  if (!countries.length) {
    grid.innerHTML=`<p style="color:#888;font-size:13px;grid-column:1/-1">No trips in ${activeYear==='all'?'this filter':''+activeYear}.</p>`;
    return;
  }
  countries.forEach(c=>{
    const trips = ft.filter(t=>t.country===c);
    const years=[...new Set(trips.map(t=>new Date(t.from).getFullYear()))].sort();
    const allCities=[...new Set(trips.flatMap(t=>t.cities||[]))];
    const card=document.createElement('div');
    card.className='card';
    card.innerHTML=`
      <div class="card-flag">${FLAGS[c]||'🌍'}</div>
      <div class="card-name">${c}</div>
      <div class="card-meta">${byCountry[c].region} · ${trips.length} trip${trips.length>1?'s':''}<br>${years.join(', ')}</div>
      <span class="pill">${allCities.length} cit${allCities.length>1?'ies':'y'}</span>`;
    card.onclick=()=>openModal(c);
    grid.appendChild(card);
  });
}

// ── Modal ─────────────────────────────────────────────────────
function openModal(c){
  const trips = filteredTrips().filter(t=>t.country===c);
  document.getElementById('m-flag').textContent=FLAGS[c]||'🌍';
  document.getElementById('m-name').textContent=c;
  document.getElementById('m-sub').textContent=`${byCountry[c].region} · ${trips.length} trip${trips.length>1?'s':''}${activeYear!=='all'?' in '+activeYear:''}`;
  const html=trips.map(t=>`
    <div class="visit-card">
      <div class="visit-dates">${fmtDate(t.from)} → ${fmtDate(t.to)} · ${getDays(t.from,t.to)} day${getDays(t.from,t.to)>1?'s':''}${t.isNew?'<span class="new-badge">new</span>':''}</div>
      <div class="visit-cities">${(t.cities||[]).map(c=>`<span class="city-tag">${c}</span>`).join('')}</div>
      <div class="visit-meta">${t.companion?'👥 '+t.companion:''}</div>
      ${t.note?`<div class="visit-note">"${t.note}"</div>`:''}
    </div>`).join('');
  document.getElementById('m-trips').innerHTML=html;
  document.getElementById('modal').classList.add('open');
}
function closeModal(){ document.getElementById('modal').classList.remove('open'); }

// ── City chips ────────────────────────────────────────────────
const chipData={f:[],e:[]};
function addCityChip(prefix){
  const inp=document.getElementById(`${prefix}-city-input`);
  const val=inp.value.trim(); if(!val) return;
  if(!chipData[prefix].includes(val)) chipData[prefix].push(val);
  renderChips(prefix); inp.value='';
}
function removeChip(prefix,city){
  chipData[prefix]=chipData[prefix].filter(c=>c!==city);
  renderChips(prefix);
}
function renderChips(prefix){
  const el=document.getElementById(`${prefix}-cities-list`);
  el.innerHTML=chipData[prefix].map(c=>`
    <span class="city-chip">${c}<button onclick="removeChip('${prefix}','${c}')" title="Remove">×</button></span>`).join('');
}

// ── Add Trip ──────────────────────────────────────────────────
function renderAddedList(){
  const el=document.getElementById('added-trips');
  if(!addedTrips.length){el.innerHTML='';return;}
  el.innerHTML=`<div style="font-size:13px;color:#888;margin-bottom:10px">Added records (${addedTrips.length})</div>`;
  [...addedTrips].reverse().forEach((t,ri)=>{
    const i=addedTrips.length-1-ri;
    const div=document.createElement('div');
    div.className='edit-row';
    div.innerHTML=`
      <div class="edit-row-info">
        <div class="edit-row-name">${FLAGS[t.country]||'🌍'} ${t.country} · ${(t.cities||[]).join(', ')}</div>
        <div class="edit-row-meta">${fmtDate(t.from)} → ${fmtDate(t.to)}${t.companion?' · '+t.companion:''}</div>
      </div>
      <button class="btn btn-danger" onclick="deleteAdded(${i})">Delete</button>`;
    el.appendChild(div);
  });
}
async function addTrip(){
  const country=document.getElementById('f-country').value.trim();
  const region=document.getElementById('f-region').value;
  const from=document.getElementById('f-from').value;
  const to=document.getElementById('f-to').value;
  const companion=document.getElementById('f-companion').value.trim();
  const note=document.getElementById('f-note').value.trim();
  const cities=[...chipData.f];
  const msg=document.getElementById('form-msg');
  const btn=document.getElementById('save-btn');
  msg.className='msg';
  if(!country||!from||!to){msg.textContent='Please fill in country and dates.';msg.className='msg error';return;}
  if(new Date(to)<new Date(from)){msg.textContent='Return date cannot be before departure.';msg.className='msg error';return;}
  btn.textContent='Saving…';btn.disabled=true;
  const trip={country,cities,region,from,to,companion,note,timestamp:new Date().toISOString(),isNew:true};
  addedTrips.push(trip);
  await saveAdded(); rebuild(); clearForm();
  msg.textContent=`✓ Saved: ${country}`;msg.className='msg success';
  setTimeout(()=>msg.className='msg',3000);
  btn.textContent='Save trip';btn.disabled=false;
}
async function deleteAdded(i){
  if(!confirm('Delete this record?'))return;
  addedTrips.splice(i,1);
  await saveAdded(); rebuild(); renderAddedList();
}
function clearForm(){
  ['f-country','f-from','f-to','f-companion','f-note'].forEach(id=>document.getElementById(id).value='');
  chipData.f=[]; renderChips('f');
  document.getElementById('f-region').value='Asia';
  document.getElementById('form-msg').className='msg';
}

// ── Edit Records ──────────────────────────────────────────────
let editingTrip=null;
function renderEditList(){
  const q=(document.getElementById('edit-search').value||'').toLowerCase();
  const reg=document.getElementById('edit-region-filter').value;
  const filtered=allTrips.filter(t=>
    (!q||t.country.toLowerCase().includes(q)||(t.cities||[]).some(c=>c.toLowerCase().includes(q)))&&
    (!reg||t.region===reg)
  ).sort((a,b)=>a.from.localeCompare(b.from));
  document.getElementById('edit-count').textContent=`${filtered.length} record${filtered.length!==1?'s':''}`;
  const list=document.getElementById('edit-list');
  list.innerHTML='';
  filtered.forEach(t=>{
    const isBase=BASE_TRIPS.includes(t);
    const div=document.createElement('div');
    div.className='edit-row';
    div.innerHTML=`
      <div class="edit-row-info">
        <div class="edit-row-name">${FLAGS[t.country]||'🌍'} ${t.country}${isBase?'':' <span class="new-badge">new</span>'}</div>
        <div class="edit-row-meta">${(t.cities||[]).join(', ')} · ${fmtDate(t.from)} → ${fmtDate(t.to)}${t.companion?' · '+t.companion:''}</div>
        ${t.note?`<div style="font-size:12px;color:#aaa;font-style:italic;margin-top:2px">"${t.note}"</div>`:''}
      </div>
      <button class="btn" style="flex-shrink:0;font-size:12px;padding:5px 14px;color:#7fb3f5;border-color:#2a5a8f" onclick="openEditModal_t(allTrips[${allTrips.indexOf(t)}])">Edit</button>`;
    list.appendChild(div);
  });
}
function openEditModal_t(t){
  editingTrip=t;
  document.getElementById('e-country').value=t.country;
  document.getElementById('e-region').value=t.region;
  document.getElementById('e-from').value=t.from;
  document.getElementById('e-to').value=t.to;
  document.getElementById('e-companion').value=t.companion||'';
  document.getElementById('e-note').value=t.note||'';
  chipData.e=[...(t.cities||[])];
  renderChips('e');
  document.getElementById('edit-msg').className='msg';
  document.getElementById('edit-modal').classList.add('open');
}
function closeEditModal(){ document.getElementById('edit-modal').classList.remove('open'); editingTrip=null; }
async function saveEdit(){
  const msg=document.getElementById('edit-msg');
  const updated={
    ...editingTrip,
    country:document.getElementById('e-country').value.trim(),
    region:document.getElementById('e-region').value,
    from:document.getElementById('e-from').value,
    to:document.getElementById('e-to').value,
    companion:document.getElementById('e-companion').value.trim(),
    note:document.getElementById('e-note').value.trim(),
    cities:[...chipData.e],
  };
  if(!updated.country||!updated.from||!updated.to){msg.textContent='Please fill in country and dates.';msg.className='msg error';return;}
  const isBase=BASE_TRIPS.includes(editingTrip);
  if(isBase){
    const idx=BASE_TRIPS.indexOf(editingTrip);
    // remove old override if any
    const oi=addedTrips.findIndex(x=>x.__overrideIdx===idx);
    if(oi>=0) addedTrips.splice(oi,1);
    // hide base
    BASE_TRIPS[idx].__hidden=true;
    // push override
    addedTrips.push({...updated,__overrideIdx:idx,isNew:false,timestamp:updated.timestamp||new Date().toISOString()});
  } else {
    const ai=addedTrips.indexOf(editingTrip);
    if(ai>=0) addedTrips[ai]={...addedTrips[ai],...updated};
  }
  await saveAdded(); rebuild(); renderEditList();
  msg.textContent='✓ Saved';msg.className='msg success';
  setTimeout(closeEditModal,700);
}
async function deleteEdit(){
  if(!confirm('Delete this record?'))return;
  const isBase=BASE_TRIPS.includes(editingTrip);
  if(isBase){
    const idx=BASE_TRIPS.indexOf(editingTrip);
    BASE_TRIPS[idx].__hidden=true;
    addedTrips.push({__deleted:true,targetIdx:idx,timestamp:'del_'+idx});
  } else {
    const ai=addedTrips.indexOf(editingTrip);
    if(ai>=0) addedTrips.splice(ai,1);
  }
  await saveAdded(); rebuild(); renderEditList(); closeEditModal();
}

let cityMarkers = L.layerGroup();

function updateCityMarkers() {
  cityMarkers.clearLayers();
  const ft = filteredTrips();
  const seen = new Set();
  ft.forEach(t => {
    (t.cities||[]).forEach(city => {
      if (seen.has(city)) return;
      seen.add(city);
      const coords = CITY_COORDS[city];
      if (!coords) return;
      const marker = L.circleMarker(coords, {
        radius: 5,
        fillColor: '#7fb3f5',
        color: '#0f0f1a',
        weight: 1.5,
        fillOpacity: 0.9,
        pane: 'markerPane',
      });
      marker.bindTooltip(`<b>${city}</b>${t.country}`, {
        className: 'map-tooltip', sticky: true, direction: 'top', offset:[0,-6]
      });
      marker.on('click', () => openModal(t.country));
      cityMarkers.addLayer(marker);
    });
  });
  if (leafletMap && !leafletMap.hasLayer(cityMarkers)) cityMarkers.addTo(leafletMap);
}
let leafletMap=null, geoLayer=null;
function redrawMap(){ if(geoLayer) geoLayer.setStyle(f=>countryStyle(f)); }
function countryStyle(f){
  const name=f.properties.name_en;
  const ft = filteredTrips();
  const visited = ft.some(t=>t.country===name);
  return{fillColor:visited?'#1e4a7a':'#1a1a2e',fillOpacity:visited?.9:.5,color:visited?'#4a8abf':'#2a2a44',weight:visited?1:.4};
}
function initMap(){
  if(leafletMap) return;
  leafletMap=L.map('leaflet-map',{center:[30,10],zoom:2,minZoom:1.5,maxZoom:12,
    zoomControl:true,scrollWheelZoom:true,doubleClickZoom:true,
    dragging:true,touchZoom:true,attributionControl:false});
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png',{subdomains:'abcd',maxZoom:19}).addTo(leafletMap);
  // city name label layer (shows at zoom 4+)
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_only_labels/{z}/{x}/{y}{r}.png',{subdomains:'abcd',maxZoom:19,pane:'shadowPane'}).addTo(leafletMap);
  fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json')
    .then(r=>r.json()).then(world=>{
      const s=document.createElement('script');
      s.src='https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js';
      s.onload=()=>{
        const geojson=topojson.feature(world,world.objects.countries);
        geojson.features.forEach(f=>{
          const a2=isoNumToAlpha2[+f.id];
          f.properties.name_en=a2?isoToCountry[a2]:null;
        });
        geoLayer=L.geoJSON(geojson,{
          style:countryStyle,
          onEachFeature(f,layer){
            const cName=f.properties.name_en;
            layer.on({
              mouseover(e){
                const ft=filteredTrips();
                if(!ft.some(t=>t.country===cName))return;
                layer.setStyle({fillColor:'#2a6aaa',weight:1.5,color:'#7fb3f5'});
                const trips=ft.filter(t=>t.country===cName);
                const years=[...new Set(trips.map(t=>new Date(t.from).getFullYear()))].sort();
                layer.bindTooltip(
                  `<b>${FLAGS[cName]||''}  ${cName}</b>${trips.length} trip${trips.length>1?'s':''} · ${years.join(', ')}`,
                  {sticky:true,className:'map-tooltip'}
                ).openTooltip(e.latlng);
              },
              mouseout(){geoLayer.resetStyle(layer);layer.unbindTooltip();},
              click(){const ft=filteredTrips();if(cName&&ft.some(t=>t.country===cName))openModal(cName);}
            });
          }
        }).addTo(leafletMap);
        cityMarkers.addTo(leafletMap);
        updateCityMarkers();
      };
      document.head.appendChild(s);
    }).catch(()=>{
      document.getElementById('map-container').innerHTML='<p style="color:#888;padding:2rem">Map failed to load. Please use the Countries tab.</p>';
    });
}
